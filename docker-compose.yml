# CampusHub 三容器部署：前端（Nginx）+ 后端（Spring Boot）+ 数据库（MySQL）
services:
  mysql:
    image: mysql:8.0
    container_name: campushub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: campushub
      TZ: Asia/Shanghai
      # 必须为 UTF-8 区域设置：容器默认 POSIX 时 mysql 客户端会退化成 latin1，
      # 导致首次导入 db/init.sql 的中文被二次编码
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 默认映射到 3307，避免与本机已有的 MySQL 3306 冲突
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅数据目录为空时执行，用于首次启动导入演示数据
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:-campushub-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 国内网络可指向镜像源，留空则使用 Maven Central
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    container_name: campushub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      # 生产部署请通过 .env 或环境变量覆盖，避免沿用仓库中的开发默认值
      JWT_SECRET: ${JWT_SECRET:-campushub-jwt-secret-2026}
    ports:
      # 直连后端接口做调试用；前端容器通过服务名 backend:8080 访问
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-campushub-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: campushub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mysql-data:
