name: CI

# 持续集成：push / PR 时自动跑单元测试 → 前端构建 → 容器内集成测试与系统测试
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  unit-test:
    name: 单元测试（后端 JUnit）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 执行单元测试
        run: mvn -B -f backend/pom.xml test

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 校验产物落到后端静态目录
        run: test -f backend/src/main/resources/static/index.html

  integration-system-test:
    name: 集成测试 + 系统测试（容器内）
    runs-on: ubuntu-latest
    needs: [unit-test, frontend-build]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建并启动容器
        run: docker compose up -d --build

      - name: 等待应用就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/categories >/dev/null; then
              echo "应用已就绪"
              exit 0
            fi
            sleep 5
          done
          echo "应用未在预期时间内就绪"
          docker compose logs app
          exit 1

      - name: 集成测试（接口 E2E 断言组）
        run: pwsh -NoProfile -File tests/api-e2e.ps1

      - name: 系统测试（Playwright 关键流程）
        working-directory: frontend
        env:
          PW_CHANNEL: bundled
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: 失败时输出容器日志
        if: failure()
        run: docker compose logs --tail 200

      - name: 清理容器
        if: always()
        run: docker compose down -v
