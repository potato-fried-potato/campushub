# 代码质量分析环境：SonarQube 社区版 + PostgreSQL
# 与交付用的三容器编排分开，按需启动，不影响应用运行：
#   docker compose -f docker-compose.sonar.yml up -d
#   docker compose -f docker-compose.sonar.yml down        # 保留数据
#   docker compose -f docker-compose.sonar.yml down -v     # 连分析数据一起清掉
services:
  sonar-db:
    image: postgres:16-alpine
    container_name: campushub-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: campushub-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    # Elasticsearch 需要较高的文件描述符与线程上限
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
