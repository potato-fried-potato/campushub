server:
  port: 8080

spring:
  application:
    name: campushub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456" # 按本机 MySQL 配置修改

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.campushub: debug

campushub:
  jwt:
    # 仅本地开发使用的默认值；生产环境务必通过 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:campushub-jwt-secret-2026}
    expire-ms: ${JWT_EXPIRE_MS:604800000}
